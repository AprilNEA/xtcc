[package]
name = "xtcc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Temporary macOS TCC development controls"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[dev-dependencies]
rusty-fork = "0.3.1"
tempfile = "3.27.0"
