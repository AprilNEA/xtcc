[package]
name = "xtcc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Temporary macOS TCC development controls"
repository = "https://github.com/AprilNEA/xtcc"
readme = "README.md"
publish = ["crates-io"]
include = [
    "/src/**",
    "/native/**",
    "/tests/**",
    "/build.rs",
    "/Makefile",
    "/README*.md",
    "/VALIDATION.md",
    "/.cargo/config.toml",
    "/rust-toolchain.toml",
    "/LICENSE*",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

[dev-dependencies]
rusty-fork = "0.3.1"
tempfile = "3.27.0"
